openapi: 3.1.0
info:
  title: API Manajemen Pengguna GASI:One
  version: 1.0.0-plan
  description: >-
    Kontrak yang direncanakan untuk FD-IAM-001. Path CRUD/kueri standar
    dihasilkan oleh gasi.one.cli; activate/deactivate merupakan aksi siklus
    hidup khusus yang sempit.
servers:
  - url: /platform-app
tags:
  - name: Akun Pengguna

paths:
  /api/v1/user-accounts:
    post:
      tags: [Akun Pengguna]
      summary: Membuat akun pengguna
      description: Memerlukan UserAccount:CREATE. Username dikanonisasi sebelum validasi keunikan.
      operationId: createUserAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAccountCreateRequest'
      responses:
        '200':
          description: Akun berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccountDetailResponseEnvelope'
        '422':
          $ref: '#/components/responses/BusinessError'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/user-accounts/{id}:
    parameters:
      - $ref: '#/components/parameters/UserAccountId'
    get:
      tags: [Akun Pengguna]
      summary: Mengambil detail akun pengguna
      description: Memerlukan UserAccount:READ. Tidak ada rahasia credential/token yang dikembalikan.
      operationId: getUserAccount
      responses:
        '200':
          description: Detail akun saat ini
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccountDetailResponseEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [Akun Pengguna]
      summary: Memperbarui field profil pengguna
      description: >-
        Memerlukan UserAccount:UPDATE. Endpoint ini tidak dapat mengubah status
        akun; version wajib untuk optimistic locking.
      operationId: updateUserAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAccountUpdateRequest'
      responses:
        '200':
          description: Profil akun berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccountDetailResponseEnvelope'
        '409':
          $ref: '#/components/responses/StaleOrConflict'
        '422':
          $ref: '#/components/responses/BusinessError'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Akun Pengguna]
      summary: Penghapusan permanen dilarang
      description: >-
        Route hasil generate yang diwarisi tetap tersedia, tetapi resource
        service hook selalu menolaknya. Manajemen Pengguna menggunakan status
        siklus hidup sebagai gantinya.
      operationId: rejectDeleteUserAccount
      responses:
        '422':
          description: PERMANENT_DELETE_NOT_ALLOWED; state tidak berubah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/user-accounts/query/one:
    post:
      tags: [Akun Pengguna]
      summary: Mencari satu akun berdasarkan filter
      description: Memerlukan UserAccount:READ dan filter non-null.
      operationId: findOneUserAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '200':
          description: Detail yang cocok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccountDetailResponseEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/user-accounts/query/list:
    post:
      tags: [Akun Pengguna]
      summary: Mengueri ringkasan akun tanpa pagination
      description: Memerlukan UserAccount:READ. UI administratif menggunakan endpoint berhalaman.
      operationId: listUserAccounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '200':
          description: Ringkasan proyeksi yang cocok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccountListResponseEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/user-accounts/query/page:
    post:
      tags: [Akun Pengguna]
      summary: Mengueri satu halaman ringkasan akun
      description: >-
        Memerlukan UserAccount:READ. Page berbasis nol dan size dibatasi
        maksimum 100 oleh framework.
      operationId: pageUserAccounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '200':
          description: Halaman proyeksi yang cocok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccountPageResponseEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/user-accounts/lookup/query/page:
    post:
      tags: [Akun Pengguna]
      summary: Mengueri halaman lookup akun pengguna
      description: Memerlukan UserAccount:LOOKUP dan mengekspos label field non-rahasia yang dikonfigurasi.
      operationId: lookupUserAccounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '200':
          description: Halaman lookup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccountPageResponseEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/user-accounts/{id}/activate:
    parameters:
      - $ref: '#/components/parameters/UserAccountId'
    post:
      tags: [Akun Pengguna]
      summary: Mengaktifkan atau mengaktifkan kembali akun
      description: >-
        Memerlukan UserAccount:UPDATE. Pengulangan aksi untuk ACTIVE adalah
        no-op; artefak yang telah diinvalidasi tidak pernah dipulihkan.
      operationId: activateUserAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleRequest'
      responses:
        '200':
          description: Detail saat ini, berubah atau tetap secara idempoten
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccountDetailResponseEnvelope'
        '409':
          $ref: '#/components/responses/StaleOrConflict'
        '422':
          $ref: '#/components/responses/BusinessError'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/user-accounts/{id}/deactivate:
    parameters:
      - $ref: '#/components/parameters/UserAccountId'
    post:
      tags: [Akun Pengguna]
      summary: Menonaktifkan akun
      description: >-
        Memerlukan UserAccount:UPDATE. Deaktivasi diri sendiri ditolak.
        Pengulangan aksi untuk INACTIVE adalah no-op dan tidak membuat transisi
        duplikat.
      operationId: deactivateUserAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleRequest'
      responses:
        '200':
          description: Detail saat ini, berubah atau tetap secara idempoten
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccountDetailResponseEnvelope'
        '409':
          $ref: '#/components/responses/StaleOrConflict'
        '422':
          $ref: '#/components/responses/BusinessError'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  parameters:
    UserAccountId:
      name: id
      in: path
      required: true
      description: ID akun stabil terenkode GASI; tidak pernah berupa BIGINT mentah.
      schema:
        type: string
        minLength: 1

  responses:
    BusinessError:
      description: Kegagalan validasi atau aturan bisnis; state tidak berubah.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    StaleOrConflict:
      description: Konflik optimistic lock atau keunikan database.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Aktor tidak diotorisasi; data terlindungi tidak diungkapkan.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Akun tidak ditemukan atau tidak boleh diungkapkan.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    AccountStatus:
      type: string
      enum: [ACTIVE, INACTIVE]
      description: Enum pada wire; label UI adalah Aktif dan Nonaktif.

    UserAccountCreateRequest:
      type: object
      additionalProperties: false
      required: [username, displayName, email, status]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 100
          pattern: '^[a-z0-9][a-z0-9._-]{2,99}$'
        displayName:
          type: string
          minLength: 1
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: [string, 'null']
          maxLength: 32
        avatar:
          type: [string, 'null']
          maxLength: 2048
        status:
          $ref: '#/components/schemas/AccountStatus'
        authorizedUntil:
          type: [string, 'null']
          format: date-time

    UserAccountUpdateRequest:
      type: object
      additionalProperties: false
      required: [version, username, displayName, email]
      properties:
        version:
          type: integer
          minimum: 0
        username:
          type: string
          minLength: 3
          maxLength: 100
          pattern: '^[a-z0-9][a-z0-9._-]{2,99}$'
        displayName:
          type: string
          minLength: 1
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: [string, 'null']
          maxLength: 32
        avatar:
          type: [string, 'null']
          maxLength: 2048
        authorizedUntil:
          type: [string, 'null']
          format: date-time

    LifecycleRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          type: integer
          minimum: 0

    UserAccountSummary:
      type: object
      required: [id, username, displayName, email, status]
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        username:
          type: string
        displayName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/AccountStatus'
        authorizedUntil:
          type: [string, 'null']
          format: date-time

    UserAccountDetail:
      allOf:
        - $ref: '#/components/schemas/UserAccountSummary'
        - type: object
          required: [version]
          properties:
            avatar:
              type: [string, 'null']
            updatedAt:
              type: [string, 'null']
              format: date-time
            createdBy:
              type: [string, 'null']
            updatedBy:
              type: [string, 'null']
            version:
              type: integer

    QueryRequest:
      type: object
      additionalProperties: false
      properties:
        filter:
          $ref: '#/components/schemas/GenericFilter'
        sorts:
          type: array
          items:
            $ref: '#/components/schemas/SortOrder'
        fields:
          type: array
          items:
            type: string
        page:
          type: integer
          minimum: 0
          default: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
          default: 10

    GenericFilter:
      oneOf:
        - $ref: '#/components/schemas/SimpleFilter'
        - $ref: '#/components/schemas/FilterGroup'
      discriminator:
        propertyName: type

    SimpleFilter:
      type: object
      required: [type, field, operator]
      properties:
        type:
          const: simple
        field:
          type: string
          enum: [username, displayName, email, phone, status, authorizedUntil]
        operator:
          type: string
          enum: [EQUALS, NOT_EQUALS, GREATER_THAN, GREATER_THAN_OR_EQUALS, LESS_THAN, LESS_THAN_OR_EQUALS, LIKE, IN, IS_NULL, IS_NOT_NULL]
        value: {}

    FilterGroup:
      type: object
      required: [type, filters]
      properties:
        type:
          type: string
          enum: [and, or]
        filters:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/GenericFilter'

    SortOrder:
      type: object
      required: [field, direction]
      properties:
        field:
          type: string
        direction:
          type: string
          enum: [ASC, DESC]

    PageUserAccountSummary:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/UserAccountSummary'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    ErrorDetail:
      type: object
      properties:
        code:
          type: [string, 'null']
        field:
          type: [string, 'null']
        message:
          type: string

    ErrorEnvelope:
      type: object
      required: [success, message, timestamp]
      properties:
        success:
          const: false
        message:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        timestamp:
          type: string
          format: date-time

    UserAccountDetailResponseEnvelope:
      type: object
      required: [success, message, data, timestamp]
      properties:
        success:
          const: true
        message:
          type: string
        data:
          $ref: '#/components/schemas/UserAccountDetail'
        timestamp:
          type: string
          format: date-time

    UserAccountListResponseEnvelope:
      type: object
      required: [success, message, data, timestamp]
      properties:
        success:
          const: true
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserAccountSummary'
        timestamp:
          type: string
          format: date-time

    UserAccountPageResponseEnvelope:
      type: object
      required: [success, message, data, timestamp]
      properties:
        success:
          const: true
        message:
          type: string
        data:
          $ref: '#/components/schemas/PageUserAccountSummary'
        timestamp:
          type: string
          format: date-time
